name: Manual Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

jobs:
  manual-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from manifest
      id: get_version
      run: |
        VERSION=$(grep '^version = ' AddonFolder/blender_manifest.toml | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version from manifest: $VERSION"

    - name: Create addon zip
      run: |
        cd AddonFolder
        zip -r ../MyoGeneratorRemix-v${{ steps.get_version.outputs.version }}.zip . -x "*.pyc" "__pycache__/*" ".git*" "*.log"
        cd ..
        ls -la MyoGeneratorRemix-v${{ steps.get_version.outputs.version }}.zip

    - name: Generate changelog
      id: changelog
      run: |
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          # If no previous tags, get all commits
          CHANGELOG=$(git log --pretty=format:"- %s" --reverse)
        else
          # Get commits since last tag
          CHANGELOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" --reverse)
        fi
        
        # Create changelog file
        cat > CHANGELOG.md << EOF
        ## What's Changed in v${{ steps.get_version.outputs.version }}
        
        ${CHANGELOG}
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v${{ steps.get_version.outputs.version }}
        EOF
        
        echo "Generated changelog:"
        cat CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: MyoGeneratorRemix v${{ steps.get_version.outputs.version }}
        body_path: CHANGELOG.md
        files: |
          MyoGeneratorRemix-v${{ steps.get_version.outputs.version }}.zip
        draft: false
        prerelease: ${{ github.event.inputs.prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}